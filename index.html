<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini-Blox Platform v10</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #121215; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* WELCOME & AUTH MODAL */
    #auth-overlay {
      position: fixed; inset: 0; background: rgba(10, 10, 14, 0.96); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box {
      background: #1b1b22; border: 1px solid #2e2e3a; border-radius: 14px;
      width: 100%; max-width: 420px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .auth-logo { font-size: 26px; font-weight: 900; color: #00e676; text-align: center; margin-bottom: 6px; letter-spacing: 1px; }
    .auth-sub { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 22px; }
    .auth-tabs { display: flex; background: #121216; border-radius: 8px; padding: 4px; margin-bottom: 18px; }
    .auth-tab {
      flex: 1; padding: 8px; border: none; background: transparent; color: #999;
      font-weight: 700; cursor: pointer; border-radius: 6px; transition: 0.2s;
    }
    .auth-tab.active { background: #00b06f; color: #fff; }
    .auth-input {
      width: 100%; background: #121216; border: 1px solid #333; color: #fff;
      padding: 11px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px;
    }
    .auth-error { color: #ff5252; font-size: 12px; margin-bottom: 10px; min-height: 16px; }
    .guest-link {
      display: block; text-align: center; margin-top: 14px; color: #888;
      font-size: 13px; cursor: pointer; text-decoration: underline;
    }
    .guest-link:hover { color: #fff; }

    /* TOP NAVIGATION BAR */
    header {
      height: 58px; background: #1b1b20; border-bottom: 1px solid #2c2c35;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0;
    }
    .logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #00e676; display: flex; align-items: center; gap: 8px; }
    .nav-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: transparent; color: #aaa; border: none; padding: 8px 14px;
      font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s;
    }
    .tab-btn:hover { background: #272730; color: #fff; }
    .tab-btn.active { background: #00b06f; color: #fff; }
    .tab-btn.admin-tab.active { background: #d32f2f; color: #fff; }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .sync-badge {
      font-size: 11px; padding: 4px 10px; border-radius: 12px;
      background: #25252e; color: #00e676; border: 1px solid #333;
    }
    .user-pill {
      display: flex; align-items: center; gap: 8px; background: #25252e;
      padding: 4px 12px 4px 5px; border-radius: 20px; cursor: pointer; border: 1px solid #333;
    }
    .user-pill:hover { border-color: #00b06f; }
    .avatar-sm {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      background: #00b06f; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 13px; color: #fff; overflow: hidden;
    }

    /* MAIN VIEWS */
    .view { display: none; flex: 1; overflow-y: auto; padding: 26px; }
    .view.active { display: block; }
    #chat-view.active { display: flex; flex-direction: column; padding: 0; overflow: hidden; }

    /* HOME TAB: GAME GRID */
    .home-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .game-card {
      background: #1e1e24; border-radius: 10px; overflow: hidden; border: 1px solid #2c2c35;
      transition: transform 0.2s; display: flex; flex-direction: column;
    }
    .game-card:hover { transform: translateY(-4px); border-color: #00b06f; }
    .thumb {
      height: 135px; display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: bold; color: rgba(255,255,255,0.9); position: relative;
    }
    .author-tag {
      position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.65);
      padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #ddd;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #aaa; margin-bottom: 14px; }
    .play-btn {
      width: 100%; padding: 10px; background: #00b06f; color: white; border: none;
      border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .play-btn:hover { background: #00c87e; }

    /* CREATOR TAB */
    .creator-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: calc(100vh - 115px); }
    .panel { background: #1e1e24; padding: 20px; border-radius: 10px; border: 1px solid #2c2c35; display: flex; flex-direction: column; }
    label { font-size: 13px; color: #bbb; margin-bottom: 6px; font-weight: 600; display: block; }
    input[type="text"], input[type="password"], textarea, select {
      background: #121215; border: 1px solid #333; color: #fff; padding: 10px;
      border-radius: 6px; margin-bottom: 14px; font-family: inherit; width: 100%;
    }
    textarea { flex: 1; resize: none; font-size: 13px; font-family: monospace; }
    .btn-secondary { background: #2979ff; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-danger { background: #e53935; color: white; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-warn { background: #f57c00; color: white; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-success { background: #00b06f; color: white; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }

    /* PROFILE EDITOR TAB */
    .profile-layout { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
    .pfp-upload-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .avatar-lg {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      background: #00b06f; display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: bold; color: #fff; border: 3px solid #2c2c35; flex-shrink: 0; overflow: hidden;
    }
    .preview-card {
      background: #1e1e24; border: 1px solid #2c2c35; border-radius: 12px; padding: 24px; text-align: center;
    }

    /* P2P CHAT TAB */
    .chat-container { display: flex; flex: 1; height: 100%; overflow: hidden; }
    .chat-sidebar {
      width: 240px; background: #18181d; border-right: 1px solid #2c2c35;
      padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .channel-btn {
      text-align: left; padding: 10px 12px; background: transparent; border: none;
      color: #aaa; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;
    }
    .channel-btn:hover { background: #24242c; color: #fff; }
    .channel-btn.active { background: #00b06f; color: #fff; }
    .chat-main { flex: 1; display: flex; flex-direction: column; background: #121215; }
    .chat-header {
      padding: 14px 20px; background: #1b1b20; border-bottom: 1px solid #2c2c35;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .msg-row { display: flex; gap: 12px; align-items: flex-start; }
    .msg-bubble {
      background: #1e1e24; border: 1px solid #2c2c35; padding: 10px 14px;
      border-radius: 10px; max-width: 75%;
    }
    .msg-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .msg-author { font-weight: 700; font-size: 13px; color: #00e676; }
    .msg-time { font-size: 11px; color: #777; }
    .msg-text { font-size: 14px; line-height: 1.4; word-break: break-word; color: #eee; }
    .chat-status-banner {
      background: #3b1818; color: #ff8a80; padding: 10px 20px; font-size: 13px;
      font-weight: 600; border-top: 1px solid #5c2323; display: none;
    }
    .chat-input-bar {
      padding: 14px 20px; background: #1b1b20; border-top: 1px solid #2c2c35;
      display: flex; gap: 10px;
    }
    .chat-input-bar input { margin-bottom: 0; flex: 1; }

    /* ADMIN PANEL */
    .admin-lock-box {
      max-width: 380px; margin: 40px auto; background: #1e1e24; padding: 28px;
      border-radius: 12px; border: 1px solid #3a2222; text-align: center;
    }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; max-width: 1100px; margin: 0 auto; }
    .admin-card { background: #1e1e24; border: 1px solid #2c2c35; border-radius: 10px; padding: 18px; }
    .admin-list-item {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 12px; background: #141418; border: 1px solid #2a2a32;
      border-radius: 8px; margin-bottom: 8px;
    }

    /* FULLSCREEN GAME PLAYER */
    #player-overlay {
      display: none; position: fixed; inset: 0; background: #000; z-index: 150; flex-direction: column;
    }
    #player-bar {
      height: 44px; background: #1b1b20; display: flex; align-items: center;
      justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #333;
    }
    #game-frame { flex: 1; width: 100%; border: none; background: #000; }
  </style>
</head>
<body>

  <!-- WELCOME / LOGIN / SIGN UP MODAL -->
