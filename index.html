<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poxel.io Chromebook FPS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
            background-color: #030305;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            display: none;
            line-height: 1.4;
        }

        #ammo-display {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: #ff0055;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            display: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(3, 3, 5, 0.9);
            color: #ffffff;
            z-index: 10;
            text-align: center;
        }

        .overlay h1 {
            font-size: 40px;
            color: #00ffcc;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 14px;
            color: #8a99ad;
            margin-bottom: 25px;
            max-width: 450px;
            line-height: 1.5;
        }

        .btn {
            padding: 12px 35px;
            font-size: 18px;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .btn:hover {
            background: #00ffcc;
            color: #030305;
        }

        #gameover-screen {
            display: none;
            background: rgba(15, 0, 3, 0.95);
        }
        #gameover-screen h1 { color: #ff0055; }
        #gameover-screen .btn { border-color: #ff0055; color: #ff0055; }
        #gameover-screen .btn:hover { background: #ff0055; color: #ffffff; }

        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 50, 0.25);
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }
    </style>
    <!-- Lightweight standard version of Three.js hosted on cloud CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="flash"></div>
    <div id="crosshair"></div>
    
    <div id="hud">
        SCORE: <span id="score-val">0</span><br>
        WAVE: <span id="wave-val">1</span><br>
        HP: <span id="hp-val">100</span>%<br>
        FPS: <span id="fps-val">60</span>
    </div>

    <div id="ammo-display">AMMO: <span id="ammo-val">30</span>/30</div>

    <div id="start-screen" class="overlay">
        <h1>POXEL FPS (CHROMEBOOK)</h1>
        <p>Use <b>W, A, S, D</b> to move, <b>SPACEBAR</b> to jump, and your <b>TRACKPAD/MOUSE</b> to look around and shoot. Press <b>R</b> to reload your weapon.</p>
        <button class="btn" id="start-btn">CLICK TO PLAY</button>
    </div>

    <div id="gameover-screen" class="overlay">
        <h1>SYSTEM OVERRIDE</h1>
        <p>Your hardware core was breached by the voxel drones.</p>
        <p style="font-size: 22px; color: #fff;">SCORE: <span id="final-score">0</span></p>
        <button class="btn" id="restart-btn">REBOOT CORE</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Core Framework Instances
        let scene, camera, renderer;
        let clock = new THREE.Clock();
        
        // Control Configurations
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let isPointerLocked = false;
        let isReloading = false;

        // Optimized Global Math Allocations (Prevents Garbage Collection Lag on Chromebooks)
        let playerVelocity = new THREE.Vector3();
        let playerDirection = new THREE.Vector3();
        let camWorldDirection = new THREE.Vector3();
        let tempForward = new THREE.Vector3();
        let tempRight = new THREE.Vector3();
        let weaponWorldPos = new THREE.Vector3();
        let bBoxTarget = new THREE.Box3();
        let enemyBoxCheck = new THREE.Box3();
        let playerBoxCheck = new THREE.Box3();

        // Constants
        const PLAYER_SPEED = 45.0;
        const GRAVITY = 35.0; 
        const JUMP_FORCE = 13.5;

        // Variables
        let score = 0, wave = 1, health = 100, ammo = 30;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let gunMesh;
        let originalGunPos = new THREE.Vector3(0.25, -0.25, -0.5);
        let recoilTimer = 0;

        // Diagnostics
        let fpsLastTime = performance.now();
        let fpsFrames = 0;
        let structuralObstacles = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030305);
            scene.fog = new THREE.FogExp2(0x030305, 0.02); // Tighter fog increases hardware execution speed

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.position.set(0, 2, 0);

            // WebGL Renderer settings performance matched for Chromebook chipsets
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1); // Locked at native density to bypass GPU scaling choke points
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lightweight lighting setup
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambient);

            const platformLight = new THREE.HemisphereLight(0x00ffcc, 0xff0055, 0.6);
            scene.add(platformLight);

            buildArenaMap();
            buildChromebookWeapon();

            window.addEventListener('resize', onWindowResize, false);
            bindInputControls();
            
            spawnWaveEntities();
            animateLoop();
        }

        function buildArenaMap() {
            // Level Arena Base Plane
            const floorGeo = new THREE.PlaneGeometry(160, 160);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x07070f });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(160, 40, 0x00ffcc, 0x11111a);
            grid.position.y = 0.005;
            scene.add(grid);

            // Boundaries
            structuralObstacles.push(new THREE.Box3(new THREE.Vector3(-80,-2,-80), new THREE.Vector3(-78,30,80)));
            structuralObstacles.push(new THREE.Box3(new THREE.Vector3(78,-2,-80), new THREE.Vector3(80,30,80)));
            structuralObstacles.push(new THREE.Box3(new THREE.Vector3(-80,-2,-80), new THREE.Vector3(80,30,-78)));
            structuralObstacles.push(new THREE.Box3(new THREE.Vector3(-80,-2,78), new THREE.Vector3(80,30,80)));

            // Fixed lightweight cover pillar layout
            const voxelColors = [0x00ffcc, 0xff0055, 0x221144];
            for (let i = 0; i < 20; i++) { 
                const h = Math.floor(Math.random() * 8) + 4;
                const w = 3;
                
                const blockGeo = new THREE.BoxGeometry(w, h, w);
                const blockMat = new THREE.MeshBasicMaterial({
                    color: voxelColors[Math.floor(Math.random() * voxelColors.length)],
                });

                const tower = new THREE.Mesh(blockGeo, blockMat);
                let tx = (Math.random() - 0.5) * 120;
                let tz = (Math.random() - 0.5) * 120;
                
                if (Math.abs(tx) < 12 && Math.abs(tz) < 12) { tx += 20; tz += 20; }

                tower.position.set(tx, h / 2, tz);
                scene.add(tower);

                structuralObstacles.push(new THREE.Box3().setFromObject(tower));
            }
        }

        function buildChromebookWeapon() {
            const gunGroup = new THREE.Group();
            
            const frameGeo = new THREE.BoxGeometry(0.08, 0.08, 0.4);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x15151e });
            const body = new THREE.Mesh(frameGeo, frameMat);
            gunGroup.add(body);

            const emitterGeo = new THREE.BoxGeometry(0.1, 0.1, 0.05);
            const emitterMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            const emitter = new THREE.Mesh(emitterGeo, emitterMat);emitter.position.z = -0.21;gunGroup.add(emitter);gunMesh = gunGroup;gunMesh.position.copy(originalGunPos);camera.add(gunMesh);scene.add(camera);}function bindInputControls() {const startBtn = document.getElementById('start-btn');const restartBtn = document.getElementById('restart-btn');const startScreen = document.getElementById('start-screen');const gameoverScreen = document.getElementById('gameover-screen');const requestLock = () => { document.body.requestPointerLock(); };startBtn.addEventListener('click', requestLock);restartBtn.addEventListener('click', () => { resetCoreRuntime(); requestLock(); });document.addEventListener('pointerlockchange', () => {if (document.pointerLockElement === document.body) {isPointerLocked = true;startScreen.style.display = 'none';gameoverScreen.style.display = 'none';document.getElementById('hud').style.display = 'block';document.getElementById('ammo-display').style.display = 'block';document.getElementById('crosshair').style.display = 'block';} else {isPointerLocked = false;if(health > 0) startScreen.style.display = 'flex';}});document.addEventListener('keydown', (e) => {if (!isPointerLocked) return;switch (e.code) {case 'KeyW': moveForward = true; break;case 'KeyA': moveLeft = true; break;case 'KeyS': moveBackward = true; break;case 'KeyD': moveRight = true; break;case 'Space': if (canJump) playerVelocity.y += JUMP_FORCE; canJump = false; break;case 'KeyR': handleReload(); break;}});document.addEventListener('keyup', (e) => {switch (e.code) {case 'KeyW': moveForward = false; break;case 'KeyA': moveLeft = false; break;case 'KeyS': moveBackward = false; break;case 'KeyD': moveRight = false; break;}});document.addEventListener('mousemove', (e) => {if (!isPointerLocked) return;camera.rotation.y -= e.movementX * 0.0025;camera.rotation.x -= e.movementY * 0.0025;camera.rotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, camera.rotation.x));});document.addEventListener('mousedown', (e) => {if (isPointerLocked && e.button === 0) triggerLaserFire();});}function handleReload() {if (isReloading || ammo === 30) return;isReloading = true;document.getElementById('ammo-val').innerText = "CLR";let startTime = performance.now();function reloadAnimation() {let current = (performance.now() - startTime) / 1000;if (current < 0.6) { // Speed up animations to save CPU clock cyclesgunMesh.position.y = originalGunPos.y - (Math.sin(current * Math.PI) * 0.25);requestAnimationFrame(reloadAnimation);} else {gunMesh.position.copy(originalGunPos);ammo = 30;document.getElementById('ammo-val').innerText = ammo;isReloading = false;}}reloadAnimation();}function triggerLaserFire() {if (ammo <= 0 || isReloading) { handleReload(); return; }ammo--;document.getElementById('ammo-val').innerText = ammo;recoilTimer = 0.08;const projectileGeo = new THREE.BoxGeometry(0.04, 0.04, 0.25);const projectileMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });const laser = new THREE.Mesh(projectileGeo, projectileMat);gunMesh.getWorldPosition(weaponWorldPos);laser.position.copy(weaponWorldPos);laser.rotation.copy(camera.rotation);camera.getWorldDirection(camWorldDirection);laser.userData = {velVector: camWorldDirection.clone().multiplyScalar(110),lifetime: 1.2};bullets.push(laser);scene.add(laser);}function spawnWaveEntities() {document.getElementById('wave-val').innerText = wave;let total = 3 + Math.min(wave * 2, 12); // Hard cap on maximum entities active at oncefor (let i = 0; i < total; i++) { spawnSingleDrone(); }}function spawnSingleDrone() {const droneGroup = new THREE.Group();const coreMesh = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0), new THREE.MeshBasicMaterial({ color: 0xff0055 }));droneGroup.add(coreMesh);const ringMesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.15, 1.4), new THREE.MeshBasicMaterial({ color: 0x330066 }));droneGroup.add(ringMesh);let dx = (Math.random() - 0.5) * 130;let dz = (Math.random() - 0.5) * 130;if (Math.abs(dx - camera.position.x) < 15) dx += 30;if (Math.abs(dz - camera.position.z) < 15) dz += 30;droneGroup.position.set(dx, 2, dz);droneGroup.userData = {hp: 1 + Math.floor(wave * 0.4),speed: 7 + Math.min(wave * 0.5, 10),phase: Math.random() * 50};enemies.push(droneGroup);scene.add(droneGroup);}function buildLowImpactExplosion(pos, colorHex) {const count = 6; // Reduced count prevents web view canvas stuttersconst geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);const mat = new THREE.MeshBasicMaterial({ color: colorHex });for (let i = 0; i < count; i++) {const p = new THREE.Mesh(geo, mat);p.position.copy(pos);p.userData = {velocity: new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random()) * 5, (Math.random() - 0.5) * 6),life: 0.4};particles.push(p);scene.add(p);}}function onWindowResize() {camera.aspect = window.innerWidth / window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth, window.innerHeight);}function handleHaltCondition() {document.exitPointerLock();isPointerLocked = false;document.getElementById('final-score').innerText = score;document.getElementById('gameover-screen').style.display = 'flex';document.getElementById('hud').style.display = 'none';document.getElementById('ammo-display').style.display = 'none';document.getElementById('crosshair').style.display = 'none';}function resetCoreRuntime() {score = 0; wave = 1; health = 100; ammo = 30;document.getElementById('score-val').innerText = score;document.getElementById('wave-val').innerText = wave;document.getElementById('hp-val').innerText = health;document.getElementById('ammo-val').innerText = ammo;enemies.forEach(e => scene.remove(e));bullets.forEach(b => scene.remove(b));particles.forEach(p => scene.remove(p));enemies = []; bullets = []; particles = [];camera.position.set(0, 2, 0);camera.rotation.set(0, 0, 0);spawnWaveEntities();}function animateLoop() {requestAnimationFrame(animateLoop);let dt = clock.getDelta();if (dt > 0.05) dt = 0.05; // Drop-frame compensation clampingfpsFrames++;let currentTimestamp = performance.now();if (currentTimestamp >= fpsLastTime + 1000) {document.getElementById('fps-val').innerText = Math.round((fpsFrames * 1000) / (currentTimestamp - fpsLastTime));fpsFrames = 0; fpsLastTime = currentTimestamp;}if (isPointerLocked && health > 0) {processLocomotionPhysics(dt);processProjectiles(dt);processEnemies(dt);processFX(dt);}renderer.render(scene, camera);}function processLocomotionPhysics(dt) {playerVelocity.x -= playerVelocity.x * 12.0 * dt;playerVelocity.z -= playerVelocity.z * 12.0 * dt;playerVelocity.y -= GRAVITY * dt;playerDirection.z = Number(moveForward) - Number(moveBackward);playerDirection.x = Number(moveRight) - Number(moveLeft);playerDirection.normalize();camera.getWorldDirection(camWorldDirection);tempForward.set(camWorldDirection.x, 0, camWorldDirection.z).normalize();tempRight.set().crossVectors(camera.up, tempForward).normalize();if (moveForward || moveBackward) playerVelocity.z += playerDirection.z * PLAYER_SPEED * dt;if (moveLeft || moveRight) playerVelocity.x += playerDirection.x * PLAYER_SPEED * dt;const preX = camera.position.x;const preZ = camera.position.z;camera.position.x += (tempForward.x * playerVelocity.z + tempRight.x * playerVelocity.x) * dt;playerBoxCheck.set(new THREE.Vector3(camera.position.x - 0.5, camera.position.y - 1.5, camera.position.z - 0.5),new THREE.Vector3(camera.position.x + 0.5, camera.position.y + 0.3, camera.position.z + 0.5));for(let box of structuralObstacles) { if(playerBoxCheck.intersectsBox(box)) { camera.position.x = preX; break; } }camera.position.z += (tempForward.z * playerVelocity.z + tempRight.z * playerVelocity.x) * dt;playerBoxCheck.set(new THREE.Vector3(camera.position.x - 0.5, camera.position.y - 1.5, camera.position.z - 0.5),new THREE.Vector3(camera.position.x + 0.5, camera.position.y + 0.3, camera.position.z + 0.5));for(let box of structuralObstacles) { if(playerBoxCheck.intersectsBox(box)) { camera.position.z = preZ; break; } }camera.position.y += playerVelocity.y * dt;if (camera.position.y < 2) { playerVelocity.y = 0; camera.position.y = 2; canJump = true; }}function processProjectiles(dt) {for (let i = bullets.length - 1; i >= 0; i--) {const b = bullets[i];b.position.addScaledVector(b.userData.velVector, dt);b.userData.lifetime -= dt;let registered = false;bBoxTarget.set(new THREE.Vector3(b.position.x - 0.1, b.position.y - 0.1, b.position.z - 0.1),new THREE.Vector3(b.position.x + 0.1, b.position.y + 0.1, b.position.z + 0.1));for (let box of structuralObstacles) {if (bBoxTarget.intersectsBox(box)) {buildLowImpactExplosion(b.position, 0x00ffcc);scene.remove(b); bullets.splice(i, 1);registered = true; break;}}if (registered) continue;for (let j = enemies.length - 1; j >= 0; j--) {const enemy = enemies[j];enemyBoxCheck.setFromObject(enemy);if (bBoxTarget.intersectsBox(enemyBoxCheck)) {scene.remove(b); bullets.splice(i, 1);registered = true;enemy.userData.hp--;if (enemy.userData.hp <= 0) {buildLowImpactExplosion(enemy.position, 0xff0055);scene.remove(enemy); enemies.splice(j, 1);score += 100;document.getElementById('score-val').innerText = score;if (enemies.length === 0) { wave++; spawnWaveEntities(); }} else {buildLowImpactExplosion(b.position, 0xffffff);}break;}}if (!registered && b.userData.lifetime <= 0) { scene.remove(b); bullets.splice(i, 1); }}}function processEnemies(dt) {const playerPos = camera.position;for (let i = enemies.length - 1; i >= 0; i--) {const enemy = enemies[i];enemy.children[0].rotation.y += 2 * dt;enemy.children[1].rotation.x += 2 * dt;const vectorToPlayer = new THREE.Vector3().subVectors(playerPos, enemy.position);const distanceVal = vectorToPlayer.length();vectorToPlayer.normalize();enemy.position.addScaledVector(vectorToPlayer, enemy.userData.speed * dt);enemy.position.y = 2.0 + Math.sin(clock.getElapsedTime() * 4 + enemy.userData.phase) * 0.5;if (distanceVal < 1.5) {health -= 10;document.getElementById('hp-val').innerText = Math.max(0, health);const flashElement = document.getElementById('flash');flashElement.style.opacity = '1';setTimeout(() => flashElement.style.opacity = '0', 60);enemy.position.addScaledVector(vectorToPlayer, -5.0); // Simple knockback pathingif (health <= 0) handleHaltCondition();}}}function processFX(dt) {if (recoilTimer > 0) {recoilTimer -= dt;gunMesh.position.z = originalGunPos.z + 0.05;} else {gunMesh.position.lerp(originalGunPos, 12 * dt);}for (let i = particles.length - 1; i >= 0; i--) {const p = particles[i];p.position.addScaledVector(p.userData.velocity, dt);p.userData.velocity.y -= 9.8 * dt;p.userData.life -= dt;if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }}}window.onload = init;
